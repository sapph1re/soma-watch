name: Build & Publish Soma Watch OTA Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode shared debug keystore (if configured)
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Build Soma Watch (:wear & :mobile) APKs
        run: |
          chmod +x ./gradlew
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME="0.1.${{ github.run_number }}-cloud"
          ./gradlew :wear:assembleDebug :mobile:assembleDebug \
            -PversionCode=$VERSION_CODE \
            -PversionName=$VERSION_NAME \
            -PgithubRepo=${{ github.repository }}

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          cp wear/build/outputs/apk/debug/wear-debug.apk release_assets/wear-debug.apk
          cp mobile/build/outputs/apk/debug/mobile-debug.apk release_assets/mobile-debug.apk

      - name: Publish GitHub Release for OTA Updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-build-${{ github.run_number }}
          name: "Soma Watch OTA #${{ github.run_number }} (v0.1.${{ github.run_number }}-cloud)"
          body: |
            Автоматическая облачная сборка **Soma Watch** для Samsung Galaxy Watch 8 (`wear-debug.apk`) и Android-компаньона (`mobile-debug.apk`).
            Коммит: ${{ github.sha }}
          files: |
            release_assets/wear-debug.apk
            release_assets/mobile-debug.apk
          prerelease: false
