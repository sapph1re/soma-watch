name: Build & Publish Soma Watch OTA Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/.soma-debug.keystore"
            echo "SOMA_KEYSTORE_PATH=$GITHUB_WORKSPACE/.soma-debug.keystore" >> "$GITHUB_ENV"
            keytool -list -v -keystore "$GITHUB_WORKSPACE/.soma-debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1|SHA256"
          fi

      - name: Build Soma Watch (:wear & :mobile) Minified Release APKs
        run: |
          chmod +x ./gradlew
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME="0.1.${{ github.run_number }}-cloud"
          ./gradlew :wear:assembleRelease :mobile:assembleRelease \
            -PversionCode=$VERSION_CODE \
            -PversionName=$VERSION_NAME \
            -PgithubRepo=${{ github.repository }}

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          cp wear/build/outputs/apk/release/wear-release.apk release_assets/soma-wear-release.apk
          cp mobile/build/outputs/apk/release/mobile-release.apk release_assets/soma-mobile-release.apk
          ls -lh release_assets/

      - name: Publish GitHub Release for OTA Updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-build-${{ github.run_number }}
          name: "Soma Watch OTA #${{ github.run_number }} (v0.1.${{ github.run_number }}-cloud)"
          body: |
            Автоматическая компактная R8-сборка **Soma Watch** для Samsung Galaxy Watch 8 (`soma-wear-release.apk`) и Android-компаньона (`soma-mobile-release.apk`).
            Коммит: ${{ github.sha }}
          files: |
            release_assets/soma-wear-release.apk
            release_assets/soma-mobile-release.apk
          prerelease: false
